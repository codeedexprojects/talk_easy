# Nginx Configuration Example for TalkEasy Django Application
# This is a reference configuration for deploying the TalkEasy app with nginx

upstream talkeasy_app {
    # Gunicorn server - adjust host and port as needed
    server 127.0.0.1:8000;
    # For Unix socket: server unix:/path/to/gunicorn.sock;
}

server {
    listen 80;
    server_name core.koottuapp.in;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name core.koottuapp.in;

    # SSL Configuration (adjust paths to your certificates)
    ssl_certificate /etc/ssl/certs/your_cert.crt;
    ssl_certificate_key /etc/ssl/private/your_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload size
    client_max_body_size 100M;

    # Access and error logs
    access_log /var/log/nginx/talkeasy_access.log;
    error_log /var/log/nginx/talkeasy_error.log;

    # Static files location
    location /static/ {
        alias /home/muhammed-fazal/Desktop/talk_easy/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files location
    location /media/ {
        alias /home/muhammed-fazal/Desktop/talk_easy/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Main application - proxy to Django/Gunicorn
    location / {
        proxy_pass http://talkeasy_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Increase timeout for long-running requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket support for Django Channels
    location /ws/ {
        proxy_pass http://talkeasy_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Health check endpoint (optional)
    location /health/ {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

# IMPORTANT NOTES:
# 1. Ensure there are NO extra slashes in your location blocks
# 2. All Django URLs should be handled by the main location / block
# 3. Static and media files should be served directly by nginx for performance
# 4. Make sure gunicorn is running on the correct host:port
# 5. Collect static files before deployment: python manage.py collectstatic
# 6. Test nginx config: sudo nginx -t
# 7. Reload nginx: sudo systemctl reload nginx
